name: Custom dev packages
run-name: Merge upstream dev and build custom NoteGen

on:
  workflow_dispatch:
    inputs:
      server_only_release:
        description: '仅重试服务器发布：填写已有 Release tag；留空正常构建'
        type: string
        default: ''
      force:
        description: Rebuild even when this upstream/custom pair was published
        type: boolean
        default: false

permissions:
  contents: read

# 避免两次合并/发布竞争。运行中的版本不会被新检查取消。
concurrency:
  group: custom-dev-packages
  cancel-in-progress: false

env:
  CI: 'true'
  COREPACK_ENABLE_AUTO_PIN: '0'
  CARGO_BUILD_JOBS: '2'
  NEXT_PUBLIC_NOTEGEN_CUSTOM_BUILD: '1'

jobs:
  prepare:
    if: github.repository == 'TheFBplus/note-gen' && github.ref == 'refs/heads/codex/html-embed' && inputs.server_only_release == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      candidate_sha: ${{ steps.merge.outputs.candidate_sha }}
      candidate_branch: ${{ steps.merge.outputs.candidate_branch }}
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - name: Fail closed unless release approval protection is configured
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/scripts/custom-release/pipeline.py check-environment
      - name: Checkout custom source with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/html-embed
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Merge upstream dev in isolated candidate
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force || false }}
        run: |
          args=()
          if [ "$FORCE_BUILD" = "true" ]; then args+=(--force); fi
          python3 automation/scripts/custom-release/pipeline.py prepare \
            --root source --metadata metadata/build-info.json "${args[@]}"
      - name: Save provenance and conflict report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: custom-build-metadata
          path: metadata/build-info.json
          retention-days: 7
          if-no-files-found: ignore

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          path: source
          persist-credentials: false
      - uses: ./automation/.github/actions/custom-build-setup
      - name: Check pipeline and HTML Embed regression
        working-directory: source
        run: |
          python3 ../automation/scripts/custom-release/test_pipeline.py
          python3 ../automation/scripts/custom-release/test_desktop_updates.py
          python3 ../automation/scripts/custom-release/test_server_deploy.py
          node ../automation/scripts/custom-release/test-update-channel.mjs
          test_dir=$(mktemp -d)
          pnpm --dir "$test_dir" add jsdom@26 --ignore-scripts
          HTML_EMBED_DOM_MODULE="$test_dir/node_modules/jsdom/lib/api.js" node scripts/html-embed-fixture.mjs
          node --experimental-strip-types scripts/round-trip-fixture.mjs
          pnpm plugin-api:check-version
          pnpm exec tsc --noEmit --incremental false
          pnpm exec eslint src/extensions/html-embed src/extensions/locales src/extensions/custom-updates scripts/html-embed-*.ts scripts/html-embed-*.tsx

  desktop:
    needs: [prepare, validate]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            bundle: nsis
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            # 显式保留 app，避免仅打包 dmg 后 Tauri 清理 app，导致后续架构校验失败。
            bundle: app,dmg
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: custom-build-metadata
          path: metadata
      - uses: ./automation/.github/actions/custom-build-setup
        with:
          rust-target: ${{ matrix.target }}
      - name: Configure isolated custom package
        run: python3 automation/scripts/custom-release/pipeline.py configure --root source --metadata metadata/build-info.json
      - name: Build native package without publisher certificates
        working-directory: source
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_BUNDLE: ${{ matrix.bundle }}
        run: |
          signing_args=()
          if [ "$BUILD_TARGET" != "aarch64-apple-darwin" ]; then signing_args+=(--no-sign); fi
          pnpm tauri build --ci --target "$BUILD_TARGET" --bundles "$BUILD_BUNDLE" "${signing_args[@]}" --config src-tauri/tauri.custom-ci.json -- --locked
      - name: Verify architecture and collect installer
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: python3 automation/scripts/custom-release/pipeline.py collect --root source --metadata metadata/build-info.json --platform "$BUILD_PLATFORM" --destination packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: custom-package-${{ matrix.platform }}
          path: packages/*
          retention-days: 7
          if-no-files-found: error

  android:
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: custom-build-metadata
          path: metadata
      - uses: ./automation/.github/actions/custom-build-setup
        with:
          rust-target: aarch64-linux-android
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-34 build-tools;36.0.0 ndk;29.0.14206865
      - name: Configure Android environment and candidate
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          export ANDROID_NDK_HOME="$NDK_HOME"
          ndk_bin="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$ndk_bin:$PATH"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "$ndk_bin" >> "$GITHUB_PATH"
          ln -sf llvm-ranlib "$ndk_bin/aarch64-linux-android-ranlib"
          python3 automation/scripts/custom-release/pipeline.py configure --root source --metadata metadata/build-info.json
          python3 automation/scripts/custom-release/pipeline.py android-init --root source --icons "$RUNNER_TEMP/custom-icons"
      - name: Build only ARM64 APK without access to signing secrets
        working-directory: source
        run: pnpm tauri android build --ci --apk --split-per-abi --target aarch64 --config src-tauri/tauri.custom-ci.json
      - name: Verify version and ABI
        run: python3 automation/scripts/custom-release/pipeline.py collect --root source --metadata metadata/build-info.json --platform android-arm64 --destination unsigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: custom-android-unsigned
          path: unsigned/*.apk
          retention-days: 7
          if-no-files-found: error

  sign-packages:
    needs: [prepare, desktop, android]
    environment: custom-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - name: Require protected environment secrets after approval
        env:
          HAS_ANDROID_KEY: ${{ secrets.RELEASE_ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_ANDROID_STORE_PASSWORD: ${{ secrets.RELEASE_ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ANDROID_PASSWORD: ${{ secrets.RELEASE_ANDROID_KEY_PASSWORD != '' }}
          HAS_UPDATER_KEY: ${{ secrets.RELEASE_UPDATER_PRIVATE_KEY != '' }}
          HAS_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_SSH_KEY != '' }}
          HAS_UPDATER_PASSWORD: ${{ secrets.RELEASE_UPDATER_KEY_PASSWORD != '' }}
        run: |
          python3 - <<'PY'
          import os
          if any(os.environ[name] != 'true' for name in ['HAS_ANDROID_KEY', 'HAS_ANDROID_STORE_PASSWORD', 'HAS_ANDROID_PASSWORD', 'HAS_UPDATER_KEY', 'HAS_UPDATER_PASSWORD', 'HAS_DEPLOY_KEY']):
              raise SystemExit('Configure all six RELEASE_* secrets in the protected custom-release environment. See scripts/custom-release/README.md.')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: custom-build-metadata
          path: metadata
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: custom-android-unsigned
          path: unsigned
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: build-tools;36.0.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: custom-package-*-x64
          merge-multiple: true
          path: desktop-packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: custom-package-macos-arm64
          path: desktop-packages
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - name: Install trusted signing tools and select updater files
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          mkdir -p "$RUNNER_TEMP/updater-signer"
          pnpm --dir "$RUNNER_TEMP/updater-signer" add @tauri-apps/cli@2.11.3 --ignore-scripts
          mkdir signing
          cp desktop-packages/*_windows-x64-setup.exe desktop-packages/*_macos-arm64.app.tar.gz signing/
      - name: Sign and verify desktop updater files without running candidate scripts
        env:
          CUSTOM_TAURI_SIGNER: ${{ runner.temp }}/updater-signer/node_modules/.bin/tauri
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.RELEASE_UPDATER_KEY_PASSWORD }}
        run: python3 automation/scripts/custom-release/pipeline.py sign-desktop --destination signing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: custom-package-desktop-signatures
          path: signing/*.sig
          retention-days: 7
          if-no-files-found: error

      - name: Sign and verify using only trusted automation code
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.RELEASE_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.CUSTOM_ANDROID_KEY_ALIAS }}
        run: python3 automation/scripts/custom-release/pipeline.py sign-android --metadata metadata/build-info.json --apk unsigned/android-arm64-unsigned.apk --destination android-signed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: custom-package-android-arm64
          path: android-signed/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Assemble the complete signed release
        run: python3 automation/scripts/custom-release/pipeline.py assemble --metadata metadata/build-info.json --destination packages
      - name: Publish only the complete three-platform prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/scripts/custom-release/pipeline.py publish --metadata metadata/build-info.json --destination packages

      - name: Install isolated SFTP publisher without deployment credentials
        run: |
          python3 -m venv "$RUNNER_TEMP/server-publisher"
          "$RUNNER_TEMP/server-publisher/bin/pip" install --disable-pip-version-check paramiko==4.0.0
      - name: Upload verified packages and atomically advance server channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DEPLOY_SSH_KEY: ${{ secrets.RELEASE_DEPLOY_SSH_KEY }}
        run: '"$RUNNER_TEMP/server-publisher/bin/python" automation/scripts/custom-release/server_deploy.py --metadata metadata/build-info.json --destination packages'
      - name: Advance channel only after complete Release publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/scripts/custom-release/pipeline.py promote-channel --metadata metadata/build-info.json --destination packages

  republish-server:
    if: github.repository == 'TheFBplus/note-gen' && github.ref == 'refs/heads/codex/html-embed' && inputs.server_only_release != ''
    environment: custom-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - name: Install trusted verification and SFTP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 -m venv "$RUNNER_TEMP/server-publisher"
          "$RUNNER_TEMP/server-publisher/bin/pip" install --disable-pip-version-check paramiko==4.0.0
      - name: Restore and verify an existing Release without rebuilding or running it
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.server_only_release }}
        run: python3 automation/scripts/custom-release/recover_release.py --tag "$RELEASE_TAG" --destination packages --metadata metadata/build-info.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: custom-build-metadata
          path: metadata/build-info.json
          retention-days: 7
      - name: Verify protection before uploading an existing Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/scripts/custom-release/pipeline.py check-environment
      - name: Publish existing signed packages to server
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DEPLOY_SSH_KEY: ${{ secrets.RELEASE_DEPLOY_SSH_KEY }}
        run: '"$RUNNER_TEMP/server-publisher/bin/python" automation/scripts/custom-release/server_deploy.py --metadata metadata/build-info.json --destination packages'
      - name: Advance GitHub backup channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/scripts/custom-release/pipeline.py promote-channel --metadata metadata/build-info.json --destination packages

  report:
    needs: [prepare, validate, desktop, android, sign-packages, republish-server]
    if: always() && github.repository == 'TheFBplus/note-gen' && github.ref == 'refs/heads/codex/html-embed'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: custom-build-metadata
          path: metadata
      - name: Mention owner with build result and close resolved failure issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOM_NOTIFICATION_USER: ${{ vars.CUSTOM_NOTIFICATION_USER || github.repository_owner }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CHANGED: ${{ inputs.server_only_release != '' && 'true' || needs.prepare.outputs.changed }}
          PUBLISH_RESULT: ${{ inputs.server_only_release != '' && needs.republish-server.result || needs.sign-packages.result }}
        run: |
          if [ "$PREPARE_RESULT" = "success" ] && [ "$CHANGED" != "true" ]; then exit 0; fi
          args=()
          if [ "$PUBLISH_RESULT" = "success" ]; then args+=(--success); fi
          python3 automation/scripts/custom-release/pipeline.py notify --metadata metadata/build-info.json "${args[@]}"
      - name: Remove duplicate Actions packages after successful Release publication
        if: needs.sign-packages.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/scripts/custom-release/pipeline.py cleanup-artifacts --metadata metadata/build-info.json
      - name: Remove only this run's temporary candidate branch
        if: always() && needs.prepare.outputs.candidate_branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ needs.prepare.outputs.candidate_branch }}
        run: |
          python3 - <<'PY'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location('pipeline', 'automation/scripts/custom-release/pipeline.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          branch = os.environ['CANDIDATE_BRANCH']
          if not branch.startswith('codex/ci-build-'): raise ValueError('Unexpected candidate branch')
          if module.api('GET', 'repos/' + module.repository() + '/git/ref/heads/' + branch):
              module.api('DELETE', 'repos/' + module.repository() + '/git/refs/heads/' + branch)
          PY
