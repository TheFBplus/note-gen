name: Upstream release reminder
run-name: Check upstream official releases

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # 北京时间每天 11:17；只提醒，不触发打包。

permissions:
  contents: read

concurrency:
  group: upstream-release-reminder
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'TheFBplus/note-gen' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify reminder behavior without network writes
        run: python3 scripts/custom-release/test_watch_upstream.py
      - name: Check formal releases and notify once per release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/custom-release/watch_upstream.py
